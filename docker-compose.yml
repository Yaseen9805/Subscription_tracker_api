services:
    mongo:
        image: mongo:7
        command: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot job: initializes the single-node replica set that transactions
    # (used by signup and delete-user) require, then exits. A plain standalone
    # mongod does not support transactions, so this step is not optional.
    mongo-init:
        image: mongo:7
        depends_on:
            mongo:
                condition: service_healthy
        restart: "no"
        entrypoint:
            - mongosh
            - --host
            - mongo:27017
            - --quiet
            - --eval
            - >
                try { rs.status().ok } catch (e) {
                  rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
                }

    app:
        build: .
        ports:
            - "5500:5500"
        depends_on:
            mongo-init:
                condition: service_completed_successfully
        environment:
            NODE_ENV: development
            PORT: 5500
            SERVER_URL: ${SERVER_URL:-http://localhost:5500}
            DB_URI: mongodb://mongo:27017/subscription-tracker?replicaSet=rs0
            JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
            QSTASH_URL: ${QSTASH_URL:-}
            QSTASH_TOKEN: ${QSTASH_TOKEN:-}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
            LOG_LEVEL: ${LOG_LEVEL:-debug}

volumes:
    mongo_data:
